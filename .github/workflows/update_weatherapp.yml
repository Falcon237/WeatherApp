name: WeatherApp aktualisieren

on:
  schedule:
    - cron: '*/5 * * * *' # alle 5 Minuten (GitHub Actions Mindestintervall)
  workflow_dispatch:       # manuell auslösbar

concurrency:
  group: netatmo-weatherapp-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # für git push

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: docs/data.json aus Cache wiederherstellen (Delta-Fetch statt Vollabruf)
        uses: actions/cache/restore@v4
        with:
          path: docs/data.json
          key: netatmo-data-${{ github.run_id }}
          restore-keys: |
            netatmo-data-

      - name: Netatmo-Daten laden und HTML exportieren
        id: fetch
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
          NETATMO_VIEWER_PASSWORD: ${{ secrets.NETATMO_VIEWER_PASSWORD }}
        run: |
          set -euo pipefail
          : "${NETATMO_CLIENT_ID:?GitHub Actions secret NETATMO_CLIENT_ID is missing}"
          : "${NETATMO_CLIENT_SECRET:?GitHub Actions secret NETATMO_CLIENT_SECRET is missing}"
          : "${NETATMO_REFRESH_TOKEN:?GitHub Actions secret NETATMO_REFRESH_TOKEN is missing}"
          : "${NETATMO_VIEWER_PASSWORD:?GitHub Actions secret NETATMO_VIEWER_PASSWORD is missing; set it to the password used to unlock indoor data}"
          # Der neue Refresh-Token wird direkt nach der Rotation in GITHUB_OUTPUT geschrieben.
          python fetch_and_export.py | tee /tmp/fetch_output.txt

      - name: Refresh-Token im Secret rotieren
        if: always() && steps.fetch.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_REFRESH_TOKEN: ${{ steps.fetch.outputs.new_refresh_token }}
        run: |
          gh secret set NETATMO_REFRESH_TOKEN \
            --body "$NEW_REFRESH_TOKEN" \
            --repo "${{ github.repository }}"

      - name: docs/data.json in Cache sichern
        if: always()
        uses: actions/cache/save@v4
        with:
          path: docs/data.json
          key: netatmo-data-${{ github.run_id }}

      - name: Änderungen committen und pushen
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # docs/data.json ist absichtlich in .gitignore (>100MB, GitHub-Limit)
          git add docs/index.html docs/data-version.json docs/.nojekyll
          if git diff --cached --quiet; then
            echo "Keine neuen Daten – kein Commit nötig."
          else
            git commit -m "auto: WeatherApp $(date -u +%Y-%m-%d)"
            git push
          fi
